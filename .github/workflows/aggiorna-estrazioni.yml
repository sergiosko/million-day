name: Aggiorna estrazioni

on:
  schedule:
    # Orari UTC: coprono le estrazioni delle 13:00 e delle 20:30 sia con l'ora solare sia con quella legale.
    - cron: "25 11,12 * * *"
    - cron: "55 18,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-estrazioni
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test del parser
        run: python3 -I scraper/test_parse_archive.py
      - name: Scarica l'archivio dell'anno corrente
        run: python3 -I scraper/update_data.py
      - name: Salva se ci sono nuove estrazioni
        run: |
          if git diff --quiet -- web/data/estrazioni.json; then
            echo "Nessuna nuova estrazione."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/estrazioni.json
          git commit -m "Aggiorna estrazioni"
          git push
